[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
readme = "README.md"
requires-python = ">={{PYTHON_VERSION}}"
authors = [
    {name = "{{AUTHOR_NAME}}", email = "{{AUTHOR_EMAIL}}"},
]
license = "{{LICENSE}}"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Add runtime deps here
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/{{GITHUB_USER}}/{{GITHUB_REPO}}"
Repository = "https://github.com/{{GITHUB_USER}}/{{GITHUB_REPO}}"
Issues = "https://github.com/{{GITHUB_USER}}/{{GITHUB_REPO}}/issues"
Changelog = "https://github.com/{{GITHUB_USER}}/{{GITHUB_REPO}}/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >10s. Skip with -m 'not slow'.",
]

[tool.ruff]
line-length = 100
target-version = "py{{PYTHON_VERSION_NODOT}}"

[tool.black]
line-length = 100
