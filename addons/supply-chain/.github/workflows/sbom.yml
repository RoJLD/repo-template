name: SBOM generation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json

      - name: Generate CycloneDX SBOM (XML)
        run: |
          cyclonedx-py environment --output-format XML --output-file sbom.cdx.xml

      - name: Upload SBOMs as release assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.xml

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
