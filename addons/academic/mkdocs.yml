site_name: {{PROJECT_TITLE}}
site_description: {{PROJECT_DESCRIPTION}}
site_author: {{AUTHOR_NAME}}
site_url: https://{{GITHUB_USER}}.github.io/{{GITHUB_REPO}}/

repo_name: {{GITHUB_USER}}/{{GITHUB_REPO}}
repo_url: https://github.com/{{GITHUB_USER}}/{{GITHUB_REPO}}
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Decisions:
    - decisions/README.md
  - Specs:
    - specs/README.md
  - Papers / references: papers/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/{{GITHUB_USER}}
