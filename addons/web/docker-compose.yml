services:
  app:
    build: .
    container_name: {{PROJECT_NAME}}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # bind-mount for local data
      - {{PROJECT_NAME}}-state:/app/state   # named volume for app state (DB, uploads)
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  {{PROJECT_NAME}}-state:
